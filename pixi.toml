[workspace]
authors = ["David Whipp <david.whipp@helsinki.fi>"]
channels = ["conda-forge"]
description = "Geodynamics course website"
name = "geodynamics-course.github.it"
platforms = ["linux-64", "osx-64", "win-64"]
version = "0.1.0"

[tasks]
render = "quarto render --fail-if-warnings"
preview = "quarto preview"

[dependencies]
quarto = ">=1.9.38,<2"
r = ">=4.3,<5"
r-knitr = ">=1.51.7,<2"
#prek = ">=0.4.4,<0.5"
